<div class="panel table-responsive"><table class="table"><tr><th>Rank</th><th>Student</th><th>Score</th><th>Percentage</th><th>Completed</th></tr>{% for user,score,total,completed,latest in rows %}<tr><td>{{ loop.index }}</td><td><img class="nav-avatar" src="{{ avatar_url(user) }}"> {{ user.full_name }}</td><td>{{ score or 0 }}/{{ total or 0 }}</td><td>{{ '%.1f'|format((score/total*100) if total else 0) }}%</td><td>{{ completed }}</td></tr>{% else %}<tr><td colspan="5">No completed exams yet.</td></tr>{% endfor %}</table></div>
