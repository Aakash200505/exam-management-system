{% extends 'base.html' %}{% block title %}Edit exam{% endblock %}{% block content %}<div class="container page narrow"><h1>Edit exam</h1><form method="post" class="panel form-panel"><label>Title<input class="form-control" name="title" value="{{ exam.title }}" required></label><label>Course<select class="form-select" name="course_id">{% for c in courses %}<option value="{{ c.id }}" {% if c.id==exam.course_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Duration in minutes<input class="form-control" type="number" name="duration" min="1" value="{{ exam.duration }}"></label><label>Total marks<input class="form-control" type="number" name="total_marks" min="0" value="{{ exam.total_marks }}"></label><label>Description<textarea class="form-control" name="description">{{ exam.description }}</textarea></label><label><input type="checkbox" name="is_active" {% if exam.is_active %}checked{% endif %}> Available to students</label><button class="btn btn-primary">Save changes</button></form></div>{% endblock %}
