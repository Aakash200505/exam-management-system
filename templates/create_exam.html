{% extends 'base.html' %}{% block title %}Create exam{% endblock %}{% block content %}<div class="container page narrow"><h1>Create exam</h1><form method="post" class="panel form-panel"><label>Title<input class="form-control" name="title" required></label><label>Course<select class="form-select" name="course_id" required>{% for c in courses %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Duration in minutes<input class="form-control" type="number" name="duration" min="1" value="30" required></label><label>Total marks<input class="form-control" type="number" name="total_marks" min="0" value="0"></label><label>Description<textarea class="form-control" name="description"></textarea></label><label><input type="checkbox" name="is_active" checked> Available to students</label><button class="btn btn-primary">Create exam</button></form></div>{% endblock %}
