{% extends 'base.html' %}{% block title %}Add question{% endblock %}{% block content %}<div class="container page narrow"><h1>Add question</h1><form method="post" class="panel form-panel"><label>Question<textarea class="form-control" name="question_text" required></textarea></label><div class="row">{% for key in 'abcd' %}<div class="col-md-6"><label>Option {{ key|upper }}<input class="form-control" name="option_{{ key }}" required></label></div>{% endfor %}</div><label>Correct answer<select class="form-select" name="correct_answer">{% for key in 'abcd' %}<option value="{{ key }}">Option {{ key|upper }}</option>{% endfor %}</select></label><div class="row"><div class="col"><label>Marks<input class="form-control" name="marks" type="number" min="1" value="1"></label></div><div class="col"><label>Time amount<input class="form-control" name="time_amount" type="number" min="1" value="60"></label></div><div class="col"><label>Unit<select class="form-select" name="time_unit"><option value="seconds">Seconds</option><option value="minutes">Minutes</option></select></label></div></div><button class="btn btn-primary">Save question</button></form></div>{% endblock %}
