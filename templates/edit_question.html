{% extends 'base.html' %}{% block title %}Edit question{% endblock %}{% block content %}<div class="container page narrow"><h1>Edit question</h1><form method="post" class="panel form-panel"><label>Question<textarea class="form-control" name="question_text" required>{{ question.question_text }}</textarea></label>{% for key in 'abcd' %}<label>Option {{ key|upper }}<input class="form-control" name="option_{{ key }}" value="{{ question|attr('option_' ~ key) }}" required></label>{% endfor %}<label>Correct answer<select class="form-select" name="correct_answer">{% for key in 'abcd' %}<option value="{{ key }}" {% if key==question.correct_answer %}selected{% endif %}>Option {{ key|upper }}</option>{% endfor %}</select></label><div class="row"><div class="col"><label>Marks<input class="form-control" name="marks" type="number" value="{{ question.marks }}"></label></div><div class="col"><label>Time amount<input class="form-control" name="time_amount" type="number" value="{{ question.time_limit }}"></label></div><div class="col"><label>Unit<select class="form-select" name="time_unit"><option value="seconds">Seconds</option><option value="minutes">Minutes</option></select></label></div></div><button class="btn btn-primary">Save question</button></form></div>{% endblock %}
