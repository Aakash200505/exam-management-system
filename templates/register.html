{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="auth"><form method="post" class="panel form-panel"><span class="eyebrow">JOIN EXAMORA</span><h1>Create account.</h1><label>First Name<input class="form-control" name="first_name" required></label><label>Last Name<input class="form-control" name="last_name" required></label><label>Username<input class="form-control" name="username" required></label><label>Password<input class="form-control" type="password" name="password" minlength="10" required><small>10+ characters, uppercase, lowercase, number, and special character.</small></label><label>Confirm Password<input class="form-control" type="password" name="confirmation" required></label><label>Role</label><div class="roles"><label><input type="radio" name="role" value="teacher" required> Teacher</label><label><input type="radio" name="role" value="student"> Student</label></div><button class="btn btn-primary w-100">REGISTER</button></form></div>{% endblock %}
